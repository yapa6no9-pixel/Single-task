<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.PNG">
<title>Single Task</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--soft:#eef2f7}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0 0 18px} h2{font-size:17px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.03)}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;background:#fff;color:var(--text);outline:none;min-height:92px;resize:none}
button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.primary{background:#111827;color:#fff;width:100%;margin-top:10px}.secondary{background:var(--soft);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>button{flex:1}
.muted{color:var(--muted);font-size:14px}.count{font-weight:700}.task{font-size:19px;line-height:1.5;font-weight:700;margin:8px 0 16px}
.hidden{display:none!important}.list{margin:0;padding-left:20px}.list li{margin:12px 0}
.taskLine{display:flex;align-items:flex-start;gap:8px}.taskText{flex:1;line-height:1.45;padding-top:6px}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mini{padding:7px 9px;border-radius:9px;font-size:12px;font-weight:700;background:var(--soft);color:var(--text)}
.mini.done{background:#111827;color:#fff}
.nowActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nowActions .primary{grid-column:1/-1;margin-top:0}
.sortEdit{margin:0 0 12px}.sortEdit button{font-size:14px;padding:10px 12px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));background:rgba(246,247,249,.92);backdrop-filter:blur(10px);padding:8px;border-radius:16px;border:1px solid var(--line);margin-top:18px}
.nav button{padding:10px 6px;font-size:12px;background:transparent;color:var(--muted)}.nav button.active{background:#fff;color:var(--text);box-shadow:0 1px 5px rgba(0,0,0,.05)}
</style>
</head>
<body>
<div class="app">
<h1>Single Task</h1>

<section id="captureView">
  <div class="card">
    <h2>思いついたことを書く</h2>
    <textarea id="captureInput" placeholder=""></textarea>
    <button class="primary" id="addBtn">登録</button>
  </div>

  <div class="card">
    <div class="row" style="align-items:center;justify-content:space-between">
      <div><div class="muted">Inbox</div><div class="count"><span id="inboxCount">0</span> 件</div></div>
      <button class="secondary" id="startSortBtn">整理する</button>
    </div>
  </div>

  <div class="card">
    <div class="muted">NOW</div>
    <div id="nowTask" class="task">まだありません</div>
    <div class="nowActions">
      <button class="secondary" id="editNowBtn">編集</button>
      <button class="secondary" id="splitNowBtn">分解</button>
      <button class="primary" id="completeNowBtn">完了</button>
    </div>
  </div>
</section>

<section id="sortView" class="hidden">
  <div class="card">
    <div class="muted">Inbox整理</div>
    <div class="muted" id="sortProgress">0 件</div>
    <div id="sortTask" class="task"></div>
    <div class="row sortEdit">
      <button class="secondary" id="editInboxBtn">編集</button>
      <button class="secondary" id="splitInboxBtn">分解</button>
    </div>
    <div class="row">
      <button class="secondary" data-sort="now">今やる</button>
      <button class="secondary" data-sort="quick">Quick</button>
      <button class="secondary" data-sort="focus">Focus</button>
    </div>
    <button class="primary" id="stopSortBtn">整理を終える</button>
  </div>
</section>

<section id="queueView" class="hidden">
  <div class="card"><h2>Quick</h2><div class="muted">15分以内で終わるもの</div><ol id="quickList" class="list"></ol></div>
  <div class="card"><h2>Focus</h2><div class="muted">まとまった時間を使うもの</div><ol id="focusList" class="list"></ol></div>
</section>

<section id="doneView" class="hidden">
  <div class="card"><h2>Done</h2><ol id="doneList" class="list"></ol></div>
</section>

<div class="nav">
  <button data-view="captureView" class="active">入力</button>
  <button data-view="sortView">整理</button>
  <button data-view="queueView">一覧</button>
  <button data-view="doneView">完了</button>
</div>
</div>

<script>
const KEY="singleTaskApp_v1";
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state) state={inbox:[],quick:[],focus:[],now:null,done:[]};
state.inbox=Array.isArray(state.inbox)?state.inbox:[];
state.quick=Array.isArray(state.quick)?state.quick:[];
state.focus=Array.isArray(state.focus)?state.focus:[];
state.done=Array.isArray(state.done)?state.done:[];
if(!("now" in state)) state.now=null;

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function cloneTask(text,source){
  return {id:makeId(),text,createdAt:source?.createdAt||new Date().toISOString()};
}
function addTask(){
  const el=document.getElementById("captureInput"), text=el.value.trim();
  if(!text)return;
  state.inbox.push({id:makeId(),text,createdAt:new Date().toISOString()});
  el.value=""; save(); render(); el.focus();
}
function showView(id){
  ["captureView","sortView","queueView","doneView"].forEach(v=>document.getElementById(v).classList.toggle("hidden",v!==id));
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===id));
  if(id==="sortView")renderSort();
}
function startSort(){
  if(!state.inbox.length){alert("Inboxは空です。");return}
  showView("sortView");
}
function renderSort(){
  const t=state.inbox[0];
  document.getElementById("sortTask").textContent=t?t.text:"整理するタスクはありません";
  document.getElementById("sortProgress").textContent=t?`残り ${state.inbox.length} 件`:"0 件";
  document.getElementById("editInboxBtn").disabled=!t;
  document.getElementById("splitInboxBtn").disabled=!t;
}
function classify(type){
  if(!state.inbox.length)return;
  const t=state.inbox.shift();
  if(type==="now"){
    if(state.now) state.focus.unshift(state.now);
    state.now=t;
  } else state[type].push(t);
  save(); render();
  if(state.inbox.length) renderSort(); else showView("captureView");
}
function promoteNext(){
  if(state.now)return;
  if(state.focus.length) state.now=state.focus.shift();
  else if(state.quick.length) state.now=state.quick.shift();
}
function completeTask(bucket,index=null){
  let t=null;
  if(bucket==="now"){
    if(!state.now)return;
    t=state.now;
    state.now=null;
  }else{
    if(!state[bucket] || index<0 || index>=state[bucket].length)return;
    t=state[bucket].splice(index,1)[0];
  }
  t.completedAt=new Date().toISOString();
  state.done.unshift(t);
  if(bucket==="now") promoteNext();
  save(); render();
}
function editTask(bucket,index=null){
  const t=bucket==="now"?state.now:state[bucket]?.[index];
  if(!t)return;
  const text=prompt("タスクを編集",t.text);
  if(text===null)return;
  const trimmed=text.trim();
  if(!trimmed)return;
  t.text=trimmed;
  save(); render();
  if(bucket==="inbox")renderSort();
}
function splitTask(bucket,index=null){
  const t=bucket==="now"?state.now:state[bucket]?.[index];
  if(!t)return;
  const input=prompt("分解後のタスクを1行に1件ずつ入力してください",t.text+"\n");
  if(input===null)return;
  const parts=input.split(/\n/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<2){
    alert("2件以上に分けて入力してください。");
    return;
  }
  const children=parts.map(text=>cloneTask(text,t));

  if(bucket==="now"){
    state.now=children[0];
    state.focus.unshift(...children.slice(1));
  }else{
    state[bucket].splice(index,1,...children);
  }
  save(); render();
  if(bucket==="inbox")renderSort();
}
function moveToNow(bucket,index){
  if(!state[bucket] || index<0 || index>=state[bucket].length)return;
  const t=state[bucket].splice(index,1)[0];
  if(state.now) state.focus.unshift(state.now);
  state.now=t;
  save(); render(); showView("captureView");
}
function renderQueueList(id,items,bucket){
  const el=document.getElementById(id); el.innerHTML="";
  if(!items.length){
    const li=document.createElement("li");
    li.textContent="なし";li.className="muted";el.appendChild(li);return;
  }
  items.forEach((t,i)=>{
    const li=document.createElement("li");
    const line=document.createElement("div");line.className="taskLine";
    const text=document.createElement("div");text.className="taskText";text.textContent=t.text;
    const actions=document.createElement("div");actions.className="actions";

    const nowBtn=document.createElement("button");nowBtn.className="mini";nowBtn.textContent="NOW";nowBtn.onclick=()=>moveToNow(bucket,i);
    const editBtn=document.createElement("button");editBtn.className="mini";editBtn.textContent="編集";editBtn.onclick=()=>editTask(bucket,i);
    const splitBtn=document.createElement("button");splitBtn.className="mini";splitBtn.textContent="分解";splitBtn.onclick=()=>splitTask(bucket,i);
    const doneBtn=document.createElement("button");doneBtn.className="mini done";doneBtn.textContent="完了";doneBtn.onclick=()=>completeTask(bucket,i);

    actions.append(nowBtn,editBtn,splitBtn,doneBtn);
    line.append(text,actions);li.appendChild(line);el.appendChild(li);
  });
}
function renderDoneList(){
  const el=document.getElementById("doneList");el.innerHTML="";
  if(!state.done.length){
    const li=document.createElement("li");li.textContent="なし";li.className="muted";el.appendChild(li);return;
  }
  state.done.forEach(t=>{
    const li=document.createElement("li");li.textContent=t.text;el.appendChild(li);
  });
}
function render(){
  document.getElementById("inboxCount").textContent=state.inbox.length;
  document.getElementById("nowTask").textContent=state.now?state.now.text:"まだありません";
  renderQueueList("quickList",state.quick,"quick");
  renderQueueList("focusList",state.focus,"focus");
  renderDoneList();

  ["completeNowBtn","editNowBtn","splitNowBtn"].forEach(id=>{
    document.getElementById(id).disabled=!state.now;
  });
}
document.getElementById("addBtn").onclick=addTask;
document.getElementById("startSortBtn").onclick=startSort;
document.getElementById("stopSortBtn").onclick=()=>showView("captureView");
document.getElementById("completeNowBtn").onclick=()=>completeTask("now");
document.getElementById("editNowBtn").onclick=()=>editTask("now");
document.getElementById("splitNowBtn").onclick=()=>splitTask("now");
document.getElementById("editInboxBtn").onclick=()=>editTask("inbox",0);
document.getElementById("splitInboxBtn").onclick=()=>splitTask("inbox",0);
document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>classify(b.dataset.sort));
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>showView(b.dataset.view));
render();
</script>
</body>
</html>

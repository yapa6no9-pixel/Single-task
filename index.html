<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon.PNG"><title>Single Task</title>
<style>
:root{--b:#f5f5f3;--c:#fff;--t:#171717;--m:#777;--l:#e5e5e1}*{box-sizing:border-box}body{margin:0;background:var(--b);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--t)}main{max-width:620px;margin:auto;padding:18px 16px 95px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:21px;font-weight:800}.muted{font-size:12px;color:var(--m)}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px;margin-bottom:13px}.now{background:#171717;color:#fff;border:0;padding:20px}.lab{font-size:11px;font-weight:800;letter-spacing:.12em;opacity:.6;margin-bottom:9px}.big{font-size:23px;font-weight:800;line-height:1.35}.parent{font-size:13px;opacity:.62;margin-top:8px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}button{border:0;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;background:#efefec}.now button{background:#fff}.now .sub{background:#2c2c2c;color:#fff;border:1px solid #444}.section{font-size:16px;font-weight:800;margin:21px 2px 9px}.capture{display:flex;gap:8px}input{width:100%;border:1px solid var(--l);border-radius:12px;padding:12px;font-size:15px}.capture input{flex:1}.item{padding:11px 0;border-top:1px solid var(--l)}.meta{font-size:11px;color:var(--m);font-weight:700;margin-bottom:4px}.action{font-size:15px;font-weight:650;line-height:1.4}.mini{padding:7px 9px;font-size:12px}.hidden{display:none!important}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid var(--l)}.navin{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{background:transparent;color:#777;border-radius:0;padding:16px}.nav .active{color:#111}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:10}.sheet{background:#fff;width:min(620px,100%);border-radius:20px;padding:18px}.sheet h3{margin:0 0 10px}.choice{width:100%;text-align:left;margin:4px 0}.note{font-size:13px;color:var(--m);line-height:1.5;margin:8px 0 13px}
</style></head><body><main>
<div class="top"><div class="brand">Single Task</div><div class="muted">Think about one thing.</div></div>
<section id="home">
<div class="card now"><div class="lab">NOW</div><div class="big" id="nowT">NOWは空です</div><div class="parent" id="nowP">Actionを1つ選ぶ</div><div class="row hidden" id="nowBtns"><button class="sub" onclick="pauseNow()">今日はここまで</button><button onclick="doneNow()">完了</button></div></div>
<div class="section">Inbox</div><div class="card"><div class="capture"><input id="cap"><button onclick="add()">追加</button></div><div class="muted" style="margin-top:8px">思いついたら、判断せずここへ。</div><div class="row"><button onclick="organize()">Inboxを整理する</button></div><div id="inbox"></div></div>
<div class="section">Action candidates</div><div id="candidates"></div>
</section>
<section id="org" class="hidden"><div class="section" style="margin-top:0">Inboxを整理</div><div class="card"><div class="lab">INBOX</div><div class="big" id="orgT"></div><div class="note">今ここで15分以内に終わらせられる？</div><button class="choice" onclick="quickNow()">はい → 今やる</button><button class="choice" onclick="classify()">いいえ → Actionとして整理</button><button class="choice" onclick="skip()">あとで</button><div class="muted" id="count" style="margin-top:10px"></div></div></section>
<section id="projects" class="hidden"><div class="section" style="margin-top:0">Projects</div><div id="plist"></div><button onclick="newProject()">＋ Projectを追加</button></section>
<section id="done" class="hidden"><div class="section" style="margin-top:0">Done</div><div class="card" id="dlist"></div></section>
</main>
<div class="nav"><div class="navin"><button class="active" data-v="home" onclick="show(this)">NOW</button><button data-v="projects" onclick="show(this)">Projects</button><button data-v="done" onclick="show(this)">Done</button></div></div>
<div class="modal" id="am"><div class="sheet"><h3>Actionとして整理</h3><input id="an" placeholder="具体的なAction"><div class="note">どのProjectに入れますか？</div><div id="choices"></div><button class="choice" onclick="makeProjectForAction()">＋ 新しいProject</button><div class="row"><button onclick="closeM('am')">キャンセル</button></div></div></div>
<div class="modal" id="pm"><div class="sheet"><h3>Projectを追加</h3><input id="pn" placeholder="Project名"><div class="row"><button onclick="closeM('pm')">キャンセル</button><button onclick="saveProject()">保存</button></div></div></div>
<script>
const KEY="singleTaskApp_v2_projects",OLDKEY="singleTaskApp_v1",S="single";
function migrateOld(){
 try{
  const raw=localStorage.getItem(OLDKEY); if(!raw)return null;
  const o=JSON.parse(raw); if(!o || o.projects)return null;
  const n=fresh(),seen=new Set(); n.actions=[];n.done=[];n.now=null;
  n.inbox=Array.isArray(o.inbox)?o.inbox.map(x=>typeof x==="string"?x:(x?.text||x?.title||"")).filter(Boolean):[];
  const text=x=>typeof x==="string"?x:(x?.text||x?.title||"");
  const add=arr=>{if(!Array.isArray(arr))return;arr.forEach(x=>{const t=text(x);if(t&&!seen.has(t)){seen.add(t);n.actions.push({id:"m"+Date.now()+Math.random(),p:S,t})}})};
  add(o.doNow);add(o.quick);add(o.focus);
  if(o.now){const t=text(o.now);if(t)n.now={id:"mnow"+Date.now(),p:S,t}}
  if(Array.isArray(o.done))o.done.forEach(x=>{const t=text(x);if(t)n.done.push({id:"md"+Date.now()+Math.random(),p:S,t})});
  return n;
 }catch(e){return null}
}
function fresh(){return{inbox:["シャンプーを買う"],projects:[{id:S,name:"単発 / Projectなし"},{id:"r",name:"読書メモを考える"},{id:"l",name:"家のレイアウトを考える"}],actions:[{id:"1",p:"r",t:"今から読む本で自由にメモしてみる"},{id:"2",p:"l",t:"リビングで気になる点を3つ書き出す"},{id:"3",p:S,t:"美容院を予約する"}],now:null,done:[]}}let st;try{st=JSON.parse(localStorage.getItem(KEY))||migrateOld()||fresh()}catch(e){st=migrateOld()||fresh()}let oi=0,pending=null,newForAction=false;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(st))}function pn(id){return st.projects.find(x=>x.id===id)?.name||"Projectなし"}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){if(st.now){$("nowT").textContent=st.now.t;$("nowP").textContent=pn(st.now.p);$("nowBtns").classList.remove("hidden")}else{$("nowT").textContent="NOWは空です";$("nowP").textContent="Actionを1つ選ぶ";$("nowBtns").classList.add("hidden")}$("inbox").innerHTML=st.inbox.length?st.inbox.map(x=>`<div class="item">${esc(x)}</div>`).join(""):'<div class="muted" style="padding:14px 0">Inboxは空です</div>';$("candidates").innerHTML=st.actions.length?st.actions.map(a=>`<div class="card"><div class="meta">${esc(pn(a.p))}</div><div class="action">${esc(a.t)}</div><div class="row"><button class="mini" onclick="toNow('${a.id}')">NOWにする</button><button class="mini" onclick="editA('${a.id}')">編集</button></div></div>`).join(""):'<div class="card muted">候補なし</div>';renderProjects();$("dlist").innerHTML=st.done.length?st.done.map(a=>`<div class="item"><div>${esc(a.t)}</div><div class="muted">${esc(pn(a.p))}</div></div>`).join(""):'<div class="muted">まだありません</div>';save()}
function renderProjects(){$("plist").innerHTML=st.projects.map(p=>{let aa=st.actions.filter(a=>a.p===p.id);return`<div class="card"><b>${esc(p.name)}</b>${aa.length?aa.map(a=>`<div class="item"><div class="action">${esc(a.t)}</div><div class="row"><button class="mini" onclick="toNow('${a.id}')">NOW</button><button class="mini" onclick="editA('${a.id}')">編集</button></div></div>`).join(""):'<div class="muted" style="margin-top:10px">Actionなし</div>'}</div>`}).join("")}
function add(){let v=$("cap").value.trim();if(!v)return;st.inbox.unshift(v);$("cap").value="";render()}function toNow(id){let i=st.actions.findIndex(a=>a.id===id);if(i<0)return;if(st.now)st.actions.unshift(st.now);st.now=st.actions.splice(i,1)[0];render();home()}function pauseNow(){if(st.now)st.actions.unshift(st.now);st.now=null;render()}function doneNow(){if(!st.now)return;st.done.unshift(st.now);st.now=null;render()}function editA(id){let a=st.actions.find(x=>x.id===id),v=prompt("Actionを編集",a.t);if(v&&v.trim()){a.t=v.trim();render()}}
function organize(){if(!st.inbox.length)return alert("Inboxは空です。");oi=0;$("home").classList.add("hidden");$("org").classList.remove("hidden");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));orgRender()}function orgRender(){if(!st.inbox.length){home();render();return}if(oi>=st.inbox.length)oi=0;$("orgT").textContent=st.inbox[oi];$("count").textContent=`${oi+1} / ${st.inbox.length}`}function quickNow(){let t=st.inbox.splice(oi,1)[0];if(st.now)st.actions.unshift(st.now);st.now={id:"a"+Date.now(),p:S,t};render();home()}function classify(){pending=st.inbox[oi];$("an").value=pending;$("choices").innerHTML=st.projects.map(p=>`<button class="choice" onclick="saveAction('${p.id}')">${esc(p.name)}</button>`).join("");$("am").style.display="flex"}function saveAction(p){let t=$("an").value.trim();if(!t)return;st.actions.push({id:"a"+Date.now(),p,t});st.inbox.splice(oi,1);pending=null;closeM("am");render();orgRender()}function skip(){oi=(oi+1)%st.inbox.length;orgRender()}
function newProject(){newForAction=false;$("pn").value="";$("pm").style.display="flex"}function makeProjectForAction(){newForAction=true;closeM("am");$("pn").value="";$("pm").style.display="flex"}function saveProject(){let n=$("pn").value.trim();if(!n)return;let p={id:"p"+Date.now(),name:n};st.projects.push(p);closeM("pm");if(newForAction&&pending!==null){newForAction=false;$("am").style.display="flex";$("choices").innerHTML=`<button class="choice" onclick="saveAction('${p.id}')">${esc(p.name)}</button>`}render()}function closeM(id){$(id).style.display="none"}
function show(b){["home","org","projects","done"].forEach(id=>$(id).classList.add("hidden"));$(b.dataset.v).classList.remove("hidden");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}function home(){["org","projects","done"].forEach(id=>$(id).classList.add("hidden"));$("home").classList.remove("hidden");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));document.querySelector('[data-v="home"]').classList.add("active")}render();
</script></body></html>
